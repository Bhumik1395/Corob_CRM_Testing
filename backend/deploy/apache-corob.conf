<VirtualHost *:80>
    ServerName 192.168.74.100
    Redirect permanent / https://192.168.74.100/
</VirtualHost>

<VirtualHost *:443>
    ServerName 192.168.74.100
    DocumentRoot /var/www/corob-analytics/frontend/dist

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/corob-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/corob-selfsigned.key

    <Directory /var/www/corob-analytics/frontend/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    <Directory /var/www/corob-analytics/frontend/dist/assets>
        Header set Cache-Control "public, max-age=2592000, immutable"
    </Directory>

    Alias /pm-pdfs/ /var/www/corob-analytics/pm-pdfs/
    <Directory /var/www/corob-analytics/pm-pdfs>
        Options -Indexes
        Require all granted
    </Directory>
    <Location /pm-pdfs/>
        Header always set X-Frame-Options "SAMEORIGIN"
    </Location>

    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/
    <Location /api/>
        LimitRequestBody 576716800
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
</VirtualHost>